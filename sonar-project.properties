# SonarCloud Project Configuration
# Configuración adaptada al repositorio: XxCr1ss/python-etl-library-and-interface

sonar.projectKey=XxCr1ss_python-etl-library-and-interface
sonar.organization=xxcr1ss

# Codificación y título
sonar.sourceEncoding=UTF-8
sonar.projectName=python-etl-library-and-interface

# Rutas de código fuente y tests
sonar.sources=frontend/src,backend
sonar.tests=frontend/src/tests

# Ingesta del reporte de cobertura generado por Vitest (LCOV)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Patrones para identificar archivos de tests
sonar.test.inclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx

# Exclusiones de análisis
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  frontend/coverage/**,\
  **/.venv/**,\
  **/venv/**,\
  comparativa-ui/**,\
  Planes/**,\
  pruebas/**,\
  figuras_svg/**,\
  sustentacion/**
