# SonarCloud Project Configuration
# Repository: XxCr1ss/python-etl-library-and-interface

sonar.projectKey=XxCr1ss_python-etl-library-and-interface
sonar.organization=xxcr1ss

# Encoding and project name
sonar.sourceEncoding=UTF-8
sonar.projectName=python-etl-library-and-interface

# Source code and test directories
sonar.sources=frontend/src,backend,etl,etl_agent.py,api/index.py
sonar.tests=frontend/src/tests,backend/tests

# Ingestion of coverage report generated by Vitest (LCOV) and pytest-cov (XML)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.python.coverage.reportPaths=backend-coverage.xml

# Patterns to identify test files
sonar.test.inclusions=\
  frontend/src/tests/**,\
  backend/tests/**

# Analysis exclusions
sonar.exclusions=\
  backend/tests/**,\
  backend/test_api_*.py,\
  frontend/e2e/**,\
  **/node_modules/**,\
  **/.next/**,\
  frontend/coverage/**,\
  backend-coverage.xml,\
  **/.venv/**,\
  **/venv/**,\
  comparativa-ui/**,\
  Planes/**,\
  pruebas/**,\
  figuras_svg/**,\
  sustentacion/**
