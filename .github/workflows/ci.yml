name: ETL Flow CI

on:
  push:
    branches:
      - main
      - master
      - "phase/**"
      - "feature/**"
      - "sonar/**"
      - "codex/**"
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  metadata-sql:
    name: Supabase metadata (SQL permissions and isolation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: "24.11.0"
          cache: npm
          cache-dependency-path: supabase/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: supabase
      - run: npm test
        working-directory: supabase

  frontend:
    name: Frontend (Typecheck, Lint, Unit & Coverage, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "24.11.0"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies cleanly
        working-directory: frontend
        run: npm ci

      - name: Run TypeScript typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run ESLint
        working-directory: frontend
        env:
          CI: "1"
        run: npm run lint

      - name: Run Vitest unit & integration suite with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Build production Next.js application
        working-directory: frontend
        env:
          CI: "1"
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: npm run build

      - name: Upload frontend coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-coverage
          path: frontend/coverage/

  python-contracts:
    name: Contratos Python (Unit & ASGI Contract Suite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install backend and dev dependencies with constraints
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r backend/requirements-dev.txt -c backend/constraints.txt
          .venv/bin/python -m pip check

      - name: Run pytest contract suite (not integration)
        run: |
          .venv/bin/python -m pytest -c backend/pytest.ini backend/tests -m "not integration" -q --junitxml=backend-contracts-junit.xml

      - name: Upload Python contracts JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-contracts-junit
          path: backend-contracts-junit.xml

  e2e-mock:
    name: E2E Mock (Playwright Chromium + Intercepted API)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "24.11.0"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium with OS dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Mock suite
        working-directory: frontend
        env:
          CI: "1"
        run: npm run test:e2e:mock

      - name: Upload E2E Mock HTML & JUnit artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-e2e-mock-report
          path: |
            frontend/playwright-report/mock/
            frontend/test-results/mock/

  real-integration:
    name: Integración Real (PostgreSQL + FastAPI + Agente + Playwright E2E Real)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: etl_test_isolated
          POSTGRES_USER: etl_test_user
          POSTGRES_PASSWORD: etl_test_synthetic_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U etl_test_user -d etl_test_isolated"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      ETL_TEST_DB_TYPE: postgresql
      ETL_TEST_DB_HOST: 127.0.0.1
      ETL_TEST_DB_PORT: "5432"
      ETL_TEST_DB_NAME: etl_test_isolated
      ETL_TEST_DB_USER: etl_test_user
      ETL_TEST_DB_PASSWORD: etl_test_synthetic_pw
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "24.11.0"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r backend/requirements-dev.txt -c backend/constraints.txt

      - name: Run Backend & Agent Real Integration Pytest Suite
        run: |
          .venv/bin/python -m pytest -c backend/pytest.ini backend/tests/integration -m integration -q --junitxml=backend-integration-junit.xml

      - name: Install frontend dependencies & Playwright Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E Real suite against FastAPI + PostgreSQL
        working-directory: frontend
        env:
          CI: "1"
        run: npm run test:e2e:real

      - name: Verify public artifacts contain no credentials or raw recordings
        id: artifact-audit
        if: success() || failure()
        run: .venv/bin/python backend/tests/integration/artifact_audit.py frontend/test-results/real backend-integration-junit.xml

      - name: Upload Real Integration & E2E artifacts
        if: always() && steps.artifact-audit.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-e2e-real-report
          path: |
            backend-integration-junit.xml
            frontend/test-results/real/summary.json
            frontend/test-results/real/junit.xml
            frontend/test-results/real/index.html
