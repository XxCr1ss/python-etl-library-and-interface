name: SonarCloud Analysis

on:
  push:
    branches:
      - main
      - master
      - 'phase/**'
      - 'feature/**'
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Run tests and generate LCOV coverage report
        working-directory: frontend
        run: npm run test:coverage

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install backend dependencies & test coverage
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r backend/requirements-dev.txt -c backend/constraints.txt

      - name: Run backend tests and generate XML coverage report
        run: |
          .venv/bin/python -m pytest -c backend/pytest.ini backend/tests -m "not integration" \
            --cov=backend \
            --cov=etl \
            --cov-report=xml:backend-coverage.xml

      - name: Scan and report to SonarCloud
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
