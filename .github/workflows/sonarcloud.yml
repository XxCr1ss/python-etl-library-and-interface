name: SonarCloud Analysis

on:
  push:
    branches:
      - main
      - master
      - 'phase/**'
      - 'feature/**'
      - 'sonar/**'
      - 'fix/**'
      - 'codex/**'
      - 'refactor/**'
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonar-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: etl_test_isolated
          POSTGRES_USER: etl_test_user
          POSTGRES_PASSWORD: etl_test_synthetic_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U etl_test_user -d etl_test_isolated"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      mysql:
        image: mysql:8.4.10
        env:
          MYSQL_DATABASE: etl_test_isolated
          MYSQL_USER: etl_test_user
          MYSQL_PASSWORD: etl_test_synthetic_pw
          MYSQL_ROOT_PASSWORD: etl_test_mysql_root_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18
      oracle:
        image: ghcr.io/gvenzl/oracle-free:23.26.3-slim-faststart
        env:
          ORACLE_PASSWORD: etl_test_oracle_admin_pw
          APP_USER: etl_test_user
          APP_USER_PASSWORD: etl_test_synthetic_pw
        ports:
          - 1521:1521
        options: >-
          --health-cmd=healthcheck.sh
          --health-interval=10s
          --health-timeout=5s
          --health-retries=24
    env:
      ETL_IGNORE_DOTENV: "1"
      ETL_TEST_DB_TYPE: postgresql
      ETL_TEST_DB_HOST: 127.0.0.1
      ETL_TEST_DB_PORT: "5432"
      ETL_TEST_DB_NAME: etl_test_isolated
      ETL_TEST_DB_USER: etl_test_user
      ETL_TEST_DB_PASSWORD: etl_test_synthetic_pw
      ETL_REQUIRED_TEST_ENGINES: mysql,oracle
      ETL_TEST_MYSQL_HOST: 127.0.0.1
      ETL_TEST_MYSQL_PORT: "3306"
      ETL_TEST_MYSQL_NAME: etl_test_isolated
      ETL_TEST_MYSQL_USER: etl_test_user
      ETL_TEST_MYSQL_PASSWORD: etl_test_synthetic_pw
      ETL_TEST_ORACLE_HOST: 127.0.0.1
      ETL_TEST_ORACLE_PORT: "1521"
      ETL_TEST_ORACLE_NAME: etl_test_isolated
      ETL_TEST_ORACLE_USER: etl_test_user
      ETL_TEST_ORACLE_PASSWORD: etl_test_synthetic_pw
      ETL_TEST_ORACLE_SERVICE_NAME: FREEPDB1
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install backend dependencies & test coverage
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r backend/requirements-dev.txt -c backend/constraints.txt

      - name: Measure real MySQL and Oracle integrations
        run: |
          for engine in mysql oracle; do
            COVERAGE_FILE=".coverage.$engine" .venv/bin/python -m pytest -c backend/pytest.ini \
              backend/tests/integration/test_load_other_engines.py \
              backend/tests/integration/test_warehouse_other_engines.py \
              -m integration -k "$engine" --tb=short --cov --cov-config=.coveragerc --cov-report= \
              --junitxml="integration-$engine.xml" -q
          done

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "24.11.0"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Run tests and generate LCOV coverage report
        working-directory: frontend
        run: npm run test:coverage

      - name: Measure isolated Python suite
        env:
          COVERAGE_FILE: .coverage.unit
        run: |
          .venv/bin/python -m pytest -c backend/pytest.ini backend/tests -m "not integration" \
            --cov --cov-config=.coveragerc --cov-report= -q

      - name: Measure real PostgreSQL and agent integration
        env:
          COVERAGE_FILE: .coverage.integration
        run: |
          .venv/bin/python -m pytest -c backend/pytest.ini backend/tests/integration -m integration \
            --ignore=backend/tests/integration/test_load_other_engines.py \
            --ignore=backend/tests/integration/test_warehouse_other_engines.py \
            --cov --cov-config=.coveragerc --cov-report= -q

      - name: Combine coverage from this checkout
        run: |
          .venv/bin/python -m coverage combine --keep .coverage.unit .coverage.integration .coverage.mysql .coverage.oracle
          .venv/bin/python -m coverage xml
          .venv/bin/python -m coverage report

      - name: Exercise real Oracle and MySQL browser flows
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e:real -- other-engines.spec.ts

      - name: Verify real integration artifacts
        run: .venv/bin/python backend/tests/integration/artifact_audit.py frontend/test-results/real integration-mysql.xml integration-oracle.xml

      - name: Upload coverage reports from this checkout
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sonar-coverage-${{ github.sha }}
          path: |
            backend-coverage.xml
            frontend/coverage/lcov.info
            integration-mysql.xml
            integration-oracle.xml
            frontend/test-results/real/summary.json
            frontend/test-results/real/junit.xml
            frontend/test-results/real/index.html
          if-no-files-found: error

      - name: Scan and report to SonarCloud
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true

      - name: Require overall coverage of 80 percent and duplication below 3 percent
        if: github.event_name == 'push'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: .venv/bin/python scripts/check_sonar_coverage.py --branch "$GITHUB_REF_NAME" --revision "$GITHUB_SHA" --minimum 80 --maximum-duplication 3
